<script>
const challenges = [
 {kind:"MALUS", title:"📸 PHOTO DE LA CACHETTE", text:"Envoie une photo de ta cachette au chercheur."},
 {kind:"BONUS", title:"🏃 FUITE EXPRESS", text:"Tu gagnes 60 secondes pour changer de cachette."},
 {kind:"DÉFI", title:"🦊 NOM DE CODE", text:"Invente un nom de code pour ta cachette."}
];

let role="hide", used=0, lastIndex=-1;

document.querySelectorAll(".role").forEach(b => {
  b.addEventListener("click", () => {
    role = b.getAttribute("data-role");
    document.querySelectorAll(".role").forEach(x => x.classList.toggle("active", x === b));
  });
});

document.getElementById("join").addEventListener("click", () => {
  const first = document.getElementById("first").value.trim();
  const last = document.getElementById("last").value.trim();
  const code = document.getElementById("code").value.trim();
  if(!first || !last || !code){ 
    document.getElementById("homeMsg").textContent = "Renseigne tous les champs."; 
    return; 
  }
  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("hello").textContent = "Salut " + first + " !";
});

document.getElementById("drawButton").addEventListener("click", () => {
  used++;
  const c = challenges[Math.floor(Math.random() * challenges.length)];
  document.getElementById("count").textContent = used;
  document.getElementById("resultKind").textContent = c.kind;
  document.getElementById("resultTitle").textContent = c.title;
  document.getElementById("resultText").textContent = c.text;
  document.getElementById("result").classList.remove("hidden");
});

document.getElementById("again").addEventListener("click", () => {
  document.getElementById("result").classList.add("hidden");
});

document.getElementById("backMenu").addEventListener("click", () => {
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("game").classList.add("hidden");
});
</script>
